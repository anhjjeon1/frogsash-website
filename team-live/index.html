<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>청개구리AUTO사전점검</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!--
  청개구리AUTO사전점검 (시제품)
  - 한 화면: ① 현장·위치 ② 실시간 촬영(화면 안 카메라) ③ 하자 정보 ④ 점검 리스트 — /team/ 앱과 같은 카드 배치·색.
  - 폰을 하자 쪽에 잠깐 멈추면 자동으로 찍고, AI가 하자 위치 상자를 돌려주면 전체=멀리서, 확대=가까이 로 저장한다.
  - 하자로 판정된 것만 정밀 분석(공종·유형·심각도·5줄 소견)까지 이어서 하고, /team/ 앱과 같은 팀 서버로 보낸다.
  - 팀 설정(이름·분야·팀 비밀번호)과 현장 목록은 /team/ 앱과 같은 기기 저장값을 그대로 쓴다.
-->
<style>
:root{--p:#0E9F6E;--pl:#31C48D;--pg:#E7F8F0;--pd:#067647;--ac:#F97316;--y:#FDB022;
  --tx:#1A2332;--ts:#5A6B7F;--th:#94A3B8;--bd:#EAECF0;--fl:#F2F4F7;--dn:#E74C3C;
  --sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#F2F4F7;color:var(--tx)}
body,button,input,textarea,select{font-family:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;letter-spacing:-.01em}
body{line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;border:0;cursor:pointer;background:none;color:inherit}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(14px + var(--sb))}

/* 머리 */
.hd{position:sticky;top:0;z-index:10;background:#fff;box-shadow:0 1px 0 var(--bd);display:flex;align-items:center;gap:8px;padding:8px 10px}
.hd .hb{background:var(--fl);border-radius:10px;padding:6px 10px;font-size:.78rem;font-weight:700;color:#344054;white-space:nowrap}
.hd .hb[data-s="err"]{background:#FEE4E2;color:#B42318}.hd .hb[data-s="need"]{background:#FEF0C7;color:#B54708}
.hd .tt{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.05rem;font-weight:800;letter-spacing:-.03em;white-space:nowrap;min-width:0}
.hd .tt i{width:28px;height:28px;background:url(../team/logo.jpg) center/128% no-repeat;flex:none}
.hd .ver{background:var(--fl);border-radius:10px;padding:4px 8px;font-size:.72rem;font-weight:700;color:var(--ts)}

/* 카드 */
.sec{background:#fff;margin:6px 8px;padding:10px;border-radius:16px;box-shadow:var(--sh)}
.sec-t{display:flex;align-items:center;gap:7px;font-size:.95rem;font-weight:700;margin-bottom:8px}
.sec-t .n{width:20px;height:20px;border-radius:50%;background:var(--pg);color:var(--pd);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.sec-t .r{margin-left:auto;font-size:.74rem;font-weight:600;color:var(--th)}
.sec-t a.r{color:var(--p);font-weight:700;text-decoration:none;font-size:.8rem}

/* ① 주소 · 위치 */
.arow{display:flex;align-items:center;gap:8px}
.arow .sec-t{margin:0;flex:none;white-space:nowrap}
.ain{flex:1;min-width:0;display:flex;align-items:center;gap:2px;background:var(--fl);border-radius:12px;padding:3px 3px 3px 11px}
.ain input{flex:1;min-width:0;border:0;background:none;font-size:.92rem;font-weight:600;padding:8px 0;color:var(--tx);outline:none}
.ain input::placeholder{font-weight:500;color:var(--th)}
.ain button{width:38px;height:38px;border-radius:50%;flex:none;font-size:1.05rem;display:flex;align-items:center;justify-content:center}
.ain .mic{background:var(--pg);color:var(--pd)}
.ain .mic.on{background:#F04438;color:#fff;animation:pulse 1s infinite}
.ain .lst{color:var(--ts);font-size:.9rem}
.rooms{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.rrow{display:flex;gap:4px}
.rrow button{position:relative;flex:1 1 auto;min-width:0;height:40px;padding:0 3px;background:var(--fl);border-radius:9px;font-size:clamp(10.5px,3.2vw,13.5px);font-weight:600;color:#475467;letter-spacing:-.05em;white-space:nowrap}
.rrow button.done{background:#DBEAFE;color:#1D4ED8;font-weight:700}
.rrow button.on{background:var(--p);color:#fff;font-weight:800}
.rrow button em{position:absolute;top:-6px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#F04438;color:#fff;font-style:normal;font-size:.66rem;font-weight:800;line-height:17px;letter-spacing:0;border:1.5px solid #fff}
.rooms.need .rrow button:not(.done){box-shadow:inset 0 0 0 1.5px #FEC84B}
.lgd{display:flex;gap:12px;justify-content:flex-end;margin-top:6px;font-size:.72rem;color:var(--ts)}
.lgd span{display:flex;align-items:center;gap:4px}
.lgd i{width:11px;height:11px;border-radius:3px;display:inline-block}
.lgd em{font-style:normal;min-width:15px;height:15px;border-radius:8px;background:#F04438;color:#fff;font-size:.6rem;font-weight:800;text-align:center;line-height:15px}

/* ② 실시간 촬영 */
.cam{position:relative;width:100%;aspect-ratio:3/4;max-height:64vh;transition:aspect-ratio .2s;border-radius:12px;overflow:hidden;background:#0B0F0C}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
.cam .flash.on{opacity:.8;transition:none}
.cam.idle{aspect-ratio:16/10}
.cam .off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#FAFBFC;border:1.5px dashed #D0D5DD;border-radius:12px;color:#344054;padding:20px;text-align:center;width:100%}
.cam .off .ic{width:64px;height:64px;border-radius:50%;background:var(--pg);display:flex;align-items:center;justify-content:center;font-size:1.7rem}
.cam .off b{font-size:1.1rem;font-weight:800}
.cam .off small{font-size:.85rem;color:var(--ts);line-height:1.6}
.cam .msg{position:absolute;left:8px;right:8px;top:10px;text-align:center;pointer-events:none;display:none}
.cam .msg span{display:inline-block;max-width:100%;padding:9px 14px;border-radius:12px;background:rgba(16,24,40,.78);color:#fff;font-size:1rem;font-weight:700;line-height:1.4;white-space:pre-line}
.cam .msg.warn span{background:rgba(217,45,32,.92)}.cam .msg.ok span{background:rgba(6,118,71,.92)}.cam .msg.busy span{background:rgba(16,24,40,.9);box-shadow:inset 0 0 0 2px var(--y)}
.cam .aim{position:absolute;left:50%;top:52%;width:min(58%,40vh);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:18px;border:3px solid rgba(255,255,255,.55);pointer-events:none;transition:border-color .15s;display:none}
.cam .aim.go{border-color:var(--y)}
.cam .aim .hold{position:absolute;left:0;right:0;bottom:-16px;height:7px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
.cam .aim .hold i{display:block;height:100%;width:0;background:var(--y);transition:width .12s linear}
.cam .tools{position:absolute;right:8px;bottom:8px;display:none;gap:8px}
.cam .tools button{width:44px;height:44px;border-radius:50%;background:rgba(16,24,40,.6);color:#fff;font-size:1.15rem}
.cam .tools button.on{background:var(--y);color:#111}
.cam .zoom{position:absolute;left:10px;right:110px;bottom:14px;display:none;align-items:center;gap:8px;color:#fff;font-size:.85rem;font-weight:700}
.cam .zoom input{flex:1;accent-color:var(--y)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.ctl .tg{min-width:96px;min-height:46px;border-radius:12px;background:var(--fl);font-size:.86rem;font-weight:800;color:#344054;line-height:1.25;padding:4px 10px}
.ctl .tg.on{background:var(--p);color:#fff}
.ctl .shot{width:70px;height:70px;border-radius:50%;background:#fff;border:6px solid var(--p);box-shadow:0 4px 14px rgba(14,159,110,.3);flex:none}
.ctl .shot:active{transform:scale(.93)}
.ctl .shot.busy{border-color:var(--y);background:#FFFAEB;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(253,176,34,.25)}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pair figure{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#FAFBFC;border:1.5px dashed #D0D5DD;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ts);font-size:.85rem;font-weight:600}
.pair figure .ic{width:40px;height:40px;border-radius:50%;background:var(--pg);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.pair figure.has{border:0;background:#000}
.pair figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pair figcaption{position:absolute;left:6px;top:6px;background:rgba(16,24,40,.65);color:#fff;font-size:.74rem;font-weight:700;border-radius:7px;padding:2px 8px;display:none}
.pair figure.has figcaption{display:block}

/* ③ 하자 정보 */
.inp{display:flex;align-items:center;gap:6px;background:var(--fl);border-radius:12px;padding:4px 4px 4px 12px}
.inp input{flex:1;min-width:0;border:0;background:none;font-size:.95rem;padding:9px 0;color:var(--tx);outline:none}
.inp button{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--ts);font-size:.95rem;flex:none;display:none}
.inp.has button{display:block}
.ex{display:flex;gap:6px;overflow-x:auto;margin-top:7px;scrollbar-width:none}
.ex::-webkit-scrollbar{display:none}
.ex button{flex:none;border:1px solid var(--bd);border-radius:16px;padding:5px 11px;font-size:.8rem;color:#344054;background:#fff}
.cells{display:grid;grid-template-columns:1fr 1.3fr 1.2fr;gap:6px;margin-top:9px}
.cells div{background:var(--fl);border-radius:10px;padding:8px 6px;text-align:center;font-size:.86rem;color:var(--th);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cells div.on{background:var(--pg);color:var(--pd);font-weight:800}
.det{margin-top:8px;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-height:84px;font-size:.88rem;line-height:1.65;white-space:pre-line;color:var(--tx)}
.det.empty{color:var(--th)}
.sv{display:inline-block;font-size:.8rem;font-weight:800;border-radius:7px;padding:2px 8px;margin-right:4px}
.sv-중대{background:#FEE4E2;color:#B42318}.sv-보통{background:#FEF0C7;color:#B54708}.sv-경미{background:#DCFAE6;color:#067647}

/* ④ 점검 리스트 */
.it{border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-top:8px}
.it .ph{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#000}
.it .ph figure{position:relative}
.it .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.it .ph figcaption{position:absolute;left:6px;top:6px;background:rgba(16,24,40,.65);color:#fff;font-size:.72rem;font-weight:700;border-radius:7px;padding:2px 8px}
.it .b{padding:10px 12px 12px}
.it .h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.it .h .lc{width:22px;height:22px;border-radius:50%;background:var(--pg);color:var(--pd);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.it .h b{flex:1;min-width:0;font-size:.98rem}
.it .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.it .tags span{font-size:.78rem;border-radius:7px;padding:2px 8px;background:var(--fl);color:#344054;font-weight:600}
.it .st{font-size:.82rem;font-weight:700;color:var(--ts);margin-bottom:6px}
.it .st.err{color:#D92D20}.it .st.ok{color:var(--pd)}
.it textarea{width:100%;font-size:.88rem;line-height:1.6;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;resize:vertical;color:var(--tx);min-height:120px}
.it .ac{display:flex;gap:6px;margin-top:8px}
.it .ac button{flex:1;min-height:42px;background:var(--fl);border-radius:10px;font-size:.88rem;font-weight:700;color:#344054}
.it .ac .pri{background:var(--p);color:#fff}
.it .ac .del{flex:none;padding:0 16px;color:#D92D20;background:#FEF3F2}
.it .meta{font-size:.74rem;color:var(--th);margin-top:8px}
.none{color:var(--th);font-size:.9rem;text-align:center;padding:18px 6px}
/* 맨 아래 단추 (팀 앱과 같은 세 단추) */
.ba{display:flex;gap:6px;margin:10px 8px 0}
.ba button{flex:1;min-height:50px;border-radius:14px;font-size:.92rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;box-shadow:var(--sh)}
.ba .rv{background:#EEF4FF;color:#3538CD}
.ba .fl{background:#fff;color:#344054}
.ba .sv2{background:var(--p);color:#fff;box-shadow:0 4px 14px rgba(14,159,110,.3)}
.ba button:disabled{opacity:.6}
.rvb{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.88rem;line-height:1.6}
.rvb b{color:#3538CD}
.foot{text-align:center;font-size:.8rem;color:var(--th);padding:14px 0 4px}
.foot a{color:var(--ts);text-decoration:none}

/* 아래에서 올라오는 창 (현장 · 팀 설정) */
.mo{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(16,24,40,.45);backdrop-filter:blur(4px)}
.mo.show{display:flex}
.mo .box{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + var(--sb));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.mo .grab{width:40px;height:4px;border-radius:2px;background:#D0D5DD;margin:0 auto 14px}
.mo h3{font-size:1.05rem;font-weight:800;margin-bottom:6px}
.mo label{display:block;font-size:.82rem;font-weight:600;color:#344054;margin:12px 0 5px}
.mo input{width:100%;font-size:1rem;border:1px solid var(--bd);background:#F9FAFB;border-radius:12px;padding:12px 13px;color:var(--tx)}
.mo .chips{display:flex;gap:6px}
.mo .chips button{background:var(--fl);border-radius:12px;padding:9px 14px;font-weight:600;color:#344054}
.mo .chips button.on{background:var(--p);color:#fff}
.mo .btn{display:block;width:100%;background:var(--p);color:#fff;border-radius:14px;padding:14px;font-size:1rem;font-weight:700;margin-top:14px;text-align:center;text-decoration:none}
.mo .btn.gray{background:var(--fl);color:#344054}
.mo .note{font-size:.78rem;color:var(--ts);line-height:1.6;margin-top:12px}
.mo .err{color:#D92D20;font-size:.85rem;font-weight:600;min-height:1.1em;margin-top:8px}
.mo .rows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mo .rows button{text-align:left;background:var(--fl);border-radius:12px;padding:11px 13px;font-size:.95rem;font-weight:700;border:1.5px solid transparent}
.mo .rows button.on{border-color:var(--p);background:var(--pg)}
.mo .rows small{display:block;font-size:.76rem;color:var(--ts);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);background:rgba(16,24,40,.94);color:#fff;border-radius:12px;padding:11px 16px;font-size:.92rem;font-weight:600;
  z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;width:max-content;max-width:92vw;text-align:center;line-height:1.45;white-space:pre-line}
#toast.show{opacity:1}#toast.err{background:rgba(180,35,24,.96)}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <button class="hb" id="cfgBtn" onclick="openCfg()">⚙ 팀 설정</button>
    <div class="tt"><i></i>청개구리AUTO사전점검</div>
    <span class="ver" id="ver"></span>
  </header>

  <section class="sec">
    <div class="arow">
      <div class="sec-t"><span class="n">1</span> 주소</div>
      <div class="ain"><input id="addr" placeholder="🎤 눌러서 말하기 · 적기" autocomplete="off" oninput="addrInput()" onkeydown="if(event.key==='Enter')this.blur()"><button class="mic" id="micA" onclick="voiceAddr()" aria-label="주소 음성 입력">🎤</button><button class="lst" onclick="openJobs()" aria-label="현장 목록">▾</button></div>
    </div>
    <div class="rooms" id="rooms"></div>
    <div class="lgd"><span><i style="background:var(--p)"></i>지금 위치</span><span><i style="background:#DBEAFE;box-shadow:inset 0 0 0 1px #93C5FD"></i>점검한 곳</span><span><em>2</em>저장한 하자</span></div>
  </section>

  <section class="sec" id="camSec">
    <div class="sec-t"><span class="n">2</span> 실시간 촬영<span class="r" id="q"></span></div>
    <div class="cam idle" id="cam">
      <video id="vid" playsinline muted autoplay></video>
      <canvas id="ov"></canvas>
      <div class="flash" id="flash"></div>
      <div class="aim" id="aim"><div class="hold" id="hold"><i></i></div></div>
      <div class="msg" id="msg"><span></span></div>
      <div class="zoom" id="zoomBox">🔍<input type="range" id="zoom" min="1" max="1" step="0.1" value="1" oninput="setZoom(this.value)"></div>
      <div class="tools" id="tools"><button id="torchBtn" onclick="toggleTorch()" aria-label="손전등" style="display:none">🔦</button></div>
      <button class="off" id="camOff" onclick="startCam()">
        <span class="ic">📷</span><b>눌러서 카메라 켜기</b>
        <small>폰을 하자 쪽으로 향하고 1~2초 멈추면<br>자동으로 찍습니다</small>
      </button>
    </div>
    <div class="ctl">
      <button class="tg on" id="autoBtn" onclick="toggleAuto()">자동 촬영<br>켜짐</button>
      <button class="shot" id="shotBtn" onclick="manualShot()" aria-label="직접 찍기"></button>
      <button class="tg" id="powBtn" onclick="cam.on?stopCam():startCam()">카메라<br>켜기</button>
    </div>
    <div class="pair">
      <figure id="pW"><span class="ic">🖼</span>멀리서 (자동)<figcaption>멀리서</figcaption></figure>
      <figure id="pC"><span class="ic">🎯</span>가까이 (자동)<figcaption>가까이</figcaption></figure>
    </div>
  </section>

  <section class="sec">
    <div class="sec-t"><span class="n">3</span> 하자 정보</div>
    <div class="inp" id="inp"><input id="note" placeholder="하자 내용 (선택) 예: 걸레받이 찍힘" oninput="drawNote()"><button onclick="$('note').value='';drawNote()" aria-label="지우기">✕</button></div>
    <div class="ex" id="ex"></div>
    <div class="cells"><div id="cR">위치</div><div id="cW">공종</div><div id="cT">하자내용</div></div>
    <div class="det empty" id="det">AI가 하자를 찾으면 여기에 분석 내용이 나옵니다.</div>
  </section>

  <section class="sec">
    <div class="sec-t"><span class="n">4</span> 점검 리스트 <span id="lCnt" style="color:var(--p)">0</span>건<a class="r" href="../team/">팀 앱 보고서 →</a></div>
    <div id="list"></div>
  </section>

  <div class="ba">
    <button class="rv" id="bRv" onclick="review()">🤖 AI전체검증</button>
    <button class="fl" id="bFile" onclick="saveFile()">📂 내파일저장</button>
    <button class="sv2" id="bAll" onclick="saveAll()">📄 전체저장</button>
  </div>

const jobTitle=id=>{const j=jobs[id];const t=j&&j.title;return (!t||t==='새 현장'||t==='현장명')?'':t;};

async function api(body,signal){
  const r=await fetch(TEAM_GAS,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({pin:cfg().pin},body)),signal});
  if(!r.ok)throw new Error('서버 응답 '+r.status);
  const d=await r.json();
  if(d.error==='bad_pin')throw new Error('팀 비밀번호가 다릅니다');
  if(d.error==='locked')throw new Error(d.message||'잠김');
  return d;
}
const jobList=()=>Object.values(jobs).filter(j=>j.title!==DEL).sort((a,b)=>b.t-a.t);
function drawJobs(){
  const l=jobList();
  if(curJob&&(!jobs[curJob]||jobs[curJob].title===DEL))curJob=null;
  if(!curJob&&l.length)curJob=l[0].id;
  const a=$('addr');if(document.activeElement!==a&&!rec)a.value=curJob?jobTitle(curJob):'';
}
/* 주소 = 지금 현장의 이름 (팀 앱의 주소 입력과 같다). 고치면 팀 서버의 현장 이름도 바뀐다 */
function newJob(){const id='j_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);jobs[id]={id,title:'현장명',t:Date.now()};curJob=id;L.set('team_jobs',jobs);L.set('team_cur',curJob);return id;}
let addrT;
function addrInput(){
  const v=$('addr').value.trim();
  if(!curJob){if(!v)return;newJob();}
  jobs[curJob].title=v||'현장명';jobs[curJob].t=Date.now();L.set('team_jobs',jobs);
  clearTimeout(addrT);addrT=setTimeout(pushAddr,1200);
}
async function pushAddr(){
  const id=curJob;if(!id||!cfg().pin||!navigator.onLine)return;
  const v=jobTitle(id);
  try{await api({a:'sync',job:{id,title:v||'현장명'},since:9e15,items:[],kv:[{k:'m.addr',v:v,t:Date.now(),by:cfg().name||''}]});setCfgBadge('ok');}
  catch(e){setCfgBadge('err',e.message);}
}
/* 주소 음성 입력 */
let rec=null;
function voiceAddr(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('이 브라우저는 음성 입력을 지원하지 않습니다. 키보드의 마이크를 써 주십시오',true,3500);$('addr').focus();return;}
  if(rec){try{rec.stop();}catch(e){}return;}
  const before=$('addr').value;
  rec=new SR();rec.lang='ko-KR';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onresult=e=>{let s='';for(const r of e.results)s+=r[0].transcript;s=s.trim();$('addr').value=s;if(e.results[e.results.length-1].isFinal&&s)addrInput();};
  rec.onerror=e=>{if(e.error!=='aborted')toast(e.error==='not-allowed'?'마이크 권한을 허용해 주십시오 (주소창 왼쪽 자물쇠 → 마이크)':'말씀을 알아듣지 못했습니다. 🎤를 다시 눌러 주십시오',true,3500);};
  rec.onend=()=>{rec=null;$('micA').classList.remove('on');if(!$('addr').value.trim())$('addr').value=before;if(cam.on)msg(idleMsg());};
  try{rec.start();}catch(e){rec=null;return;}
  $('micA').classList.add('on');$('addr').value='';$('addr').placeholder='🎤 주소를 말씀해 주세요…';
  setTimeout(()=>{$('addr').placeholder='🎤 눌러서 말하기 · 적기';},6000);
}
function openJobs(){

    :'<div class="note">현장이 없습니다. 팀 앱에서 현장을 먼저 만들어 주십시오.</div>')+
    '<button class="btn" onclick="closeMo();newJob();drawJobs();render();voiceAddr()">＋ 새 현장 (주소 말하기)</button>');

async function dbPut(o){try{const d=await idb();await new Promise((r,j)=>{const tx=d.transaction('items','readwrite');tx.objectStore('items').put(o);tx.oncomplete=r;tx.onerror=()=>j(tx.error);});}catch(e){console.warn('dbPut',e);}}

/* ============================================================ 카메라 */
const cam={on:false,stream:null,track:null,auto:L.get('live_auto',true),torch:false,busy:false,armed:true,still:0,moved:0,prev:null,seen:[],timer:0,vis:true};

/* 카메라 화면이 60% 이상 보일 때만 자동 촬영 (스크롤해서 목록을 볼 때 잘못 찍히지 않도록) */
try{new IntersectionObserver(es=>{es.forEach(e=>{const v=e.intersectionRatio>=0.6;if(v!==cam.vis){cam.vis=v;cam.still=0;if(cam.on)msg(idleMsg());}});},{threshold:[0,0.6,1]}).observe($('cam'));}catch(e){}

async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('이 브라우저는 화면 안 카메라를 지원하지 않습니다',true,4000);return;}
  try{
    cam.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}}});
  }catch(e){toast(e.name==='NotAllowedError'?'카메라 권한을 허용해 주십시오 (주소창 왼쪽 자물쇠 → 카메라)':'카메라를 켜지 못했습니다: '+e.message,true,5000);return;}
  const v=$('vid');v.srcObject=cam.stream;try{await v.play();}catch(e){}
  cam.track=cam.stream.getVideoTracks()[0];cam.on=true;cam.prev=null;cam.still=0;cam.armed=true;
  $('cam').classList.remove('idle');$('camOff').style.display='none';$('tools').style.display='flex';drawAuto();drawPow();
  /* 손전등 · 확대 (안드로이드 크롬에서 주로 지원) */
  let caps={};try{caps=cam.track.getCapabilities?cam.track.getCapabilities():{};}catch(e){}
  $('torchBtn').style.display=caps.torch?'block':'none';
  if(caps.zoom&&caps.zoom.max>caps.zoom.min){const z=$('zoom');z.min=caps.zoom.min;z.max=Math.min(caps.zoom.max,8);z.step=caps.zoom.step||0.1;z.value=(cam.track.getSettings().zoom||caps.zoom.min);$('zoomBox').style.display='flex';}
  wake();
  /* 카메라 칸이 머리 띠 바로 아래에 오도록 올린다 */
  const y=$('camSec').getBoundingClientRect().top+scrollY-document.querySelector('.hd').offsetHeight-4;window.scrollTo({top:y,behavior:'smooth'});
  msg(idleMsg());
  if(!room)toast('① 에서 위치를 골라 주십시오',false,3000);
  clearInterval(cam.timer);cam.timer=setInterval(tick,120);
}
function stopCam(){
  clearInterval(cam.timer);cam.on=false;
  if(cam.stream)cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null;cam.track=null;
  $('vid').srcObject=null;$('cam').classList.add('idle');$('camOff').style.display='flex';$('tools').style.display='none';$('zoomBox').style.display='none';$('msg').style.display='none';setHold(0);clearOv();drawAuto();drawPow();
  if(cam.wl){try{cam.wl.release();}catch(e){}cam.wl=null;}
}
async function wake(){try{if('wakeLock' in navigator)cam.wl=await navigator.wakeLock.request('screen');}catch(e){}}
async function toggleTorch(){if(!cam.track)return;cam.torch=!cam.torch;try{await cam.track.applyConstraints({advanced:[{torch:cam.torch}]});$('torchBtn').classList.toggle('on',cam.torch);}catch(e){cam.torch=false;toast('손전등을 켤 수 없습니다',true);}}
function setZoom(v){if(cam.track)cam.track.applyConstraints({advanced:[{zoom:Number(v)}]}).catch(()=>{});}
function toggleAuto(){cam.auto=!cam.auto;L.set('live_auto',cam.auto);drawAuto();setHold(0);cam.still=0;if(cam.on)msg(idleMsg());}
function setHold(p){$('hold').firstChild.style.width=p+'%';$('aim').classList.toggle('go',p>0);}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cam.on){stopCam();cam.resume=true;}else if(!document.hidden&&cam.resume){cam.resume=false;startCam();}});
window.addEventListener('resize',clearOv);

/* 작은 회색 화면 */
function grab(){const v=$('vid');if(!v.videoWidth)return null;sctx.drawImage(v,0,0,80,60);const d=sctx.getImageData(0,0,80,60).data,g=new Uint8Array(4800);let s=0;for(let i=0,j=0;i<d.length;i+=4,j++){g[j]=(d[i]*3+d[i+1]*6+d[i+2])/10;s+=g[j];}return {g,mean:s/4800};}
function gdiff(a,b){let s=0;for(let i=0;i<a.length;i++)s+=Math.abs(a[i]-b[i]);return s/a.length;}
/* 선명도: 이웃 픽셀 차이의 평균 (흔들린 사진은 작다) */
function sharp(g){let s=0,n=0;for(let y=1;y<59;y++)for(let x=1;x<79;x++){const i=y*80+x;s+=Math.abs(4*g[i]-g[i-1]-g[i+1]-g[i-80]-g[i+80]);n++;}return s/n;}

function tick(){
  if(!cam.on)return;
  const f=grab();if(!f)return;
  const d=cam.prev?gdiff(f.g,cam.prev):99;cam.prev=f.g;
  if(!cam.armed){
    if(d>MOVE_DIFF){cam.moved+=120;if(cam.moved>=REARM_MS){cam.armed=true;cam.moved=0;clearOv();}}
    setHold(0);return;
  }
  /* 창이 열려 있거나, 글자를 입력 중이거나, 카메라가 덜 보이거나, 앞 사진을 확인 중이면 찍지 않는다 */
  const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(!cam.auto||cam.busy||moKind||typing||rec||!cam.vis){setHold(0);cam.still=0;return;}
  if(d<STILL_DIFF){cam.still+=120;}else{cam.still=0;}
  setHold(Math.min(100,cam.still/HOLD_MS*100));
  if(cam.still<HOLD_MS)return;
  cam.still=0;setHold(0);
  if(f.mean<22){msg('너무 어둡습니다 — 🔦 손전등을 켜 주세요','warn',2500);cam.armed=false;return;}
  if(f.mean>240){msg('빛이 너무 강합니다 — 각도를 바꿔 주세요','warn',2500);cam.armed=false;return;}
  if(sharp(f.g)<2.2){msg('초점이 흐립니다 — 조금 떨어져 주세요','warn',2200);cam.armed=false;return;}
  /* 방금 본 장면이면 AI에 다시 묻지 않는다 */
  const s=cam.seen.find(x=>gdiff(x.g,f.g)<SAME_DIFF);
  if(s){msg(s.defect?'이미 저장한 하자입니다':'방금 확인한 곳 — 하자 없음','',1800);cam.armed=false;return;}
  capture(f,true);
}
function manualShot(){if(!cam.on){startCam();return;}if(cam.busy){toast('앞 사진을 확인하는 중입니다');return;}const f=grab();if(f)capture(f,false);}

/* 화면 위 상자 그리기 (영상은 object-fit:cover 라 잘린 만큼 맞춘다) */
function clearOv(){const c=$('ov');c.getContext('2d').clearRect(0,0,c.width,c.height);}
function drawOv(box,label){
  const c=$('ov'),v=$('vid'),W=c.clientWidth,H=c.clientHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;
  const x=c.getContext('2d');x.scale(devicePixelRatio,devicePixelRatio);
  const vw=v.videoWidth,vh=v.videoHeight,k=Math.max(W/vw,H/vh),ox=(W-vw*k)/2,oy=(H-vh*k)/2;
  const bx=ox+box[1]/1000*vw*k,by=oy+box[0]/1000*vh*k,bw=(box[3]-box[1])/1000*vw*k,bh=(box[2]-box[0])/1000*vh*k;
  x.strokeStyle='#F04438';x.lineWidth=4;x.strokeRect(bx,by,bw,bh);
  if(label){x.font='800 16px Pretendard,sans-serif';const tw=x.measureText(label).width;const ty=by>30?by-26:by+bh+4;x.fillStyle='#F04438';x.fillRect(bx-2,ty,tw+14,24);x.fillStyle='#fff';x.fillText(label,bx+5,ty+17);}
}

function beep(){try{const a=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.frequency.value=1250;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.08);}catch(e){}try{navigator.vibrate&&navigator.vibrate(50);}catch(e){}}
function flash(){const e=$('flash');e.classList.add('on');setTimeout(()=>e.classList.remove('on'),60);}
function toCanvas(src,sx,sy,sw,sh,max){const k=Math.min(1,max/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext('2d').drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);return c;}
const b64=c=>c.split(',')[1];

async function capture(f,auto){
  if(!cfg().pin){toast('먼저 팀 설정에서 팀 비밀번호를 넣어 주십시오',true,3500);openCfg();return;}
  if(!navigator.onLine){toast('인터넷이 연결되어야 AI가 확인할 수 있습니다',true,3000);return;}
  const v=$('vid'),W=v.videoWidth,H=v.videoHeight;
  /* 원본 한 장 (영상 해상도 그대로) */
  const full=document.createElement('canvas');full.width=W;full.height=H;full.getContext('2d').drawImage(v,0,0,W,H);
  beep();flash();cam.busy=true;cam.armed=false;$('shotBtn').classList.add('busy');
  msg('🔍 AI가 하자를 보고 분석하는 중…','busy');
  const nt=$('note').value.trim();
  /* 한 번의 AI 호출로 하자 여부 + 위치 상자 + 정밀 분석(공종·유형·심각도·5줄 소견)까지 받는다 (하자 1건 = AI 1회) */
  const img=toCanvas(full,0,0,W,H,1536).toDataURL('image/jpeg',0.82);
  const workList=Object.keys(WM).map(w=>w+'('+Object.keys(WM[w]).join(',')+')').join('; ');

    '[하자유형] 들뜸,마감불량,흠집/찍힘,면불량,오염,미시공,파손,틈새,코킹불량,수직수평불량,개폐불량,고정불량,작동불량,줄눈불량,단차,구배불량,이색/변색,누수,균열,도장불량,이음불량,배수불량,점등불량,악취,기밀불량,결로,곰팡이,잠금불량,소음,풍량부족,필터불량,단열불량'+NL+
    '[판정기준] 국토부 「공동주택 하자의 조사, 보수비용 산정 및 하자판정기준」을 적용합니다. 조 번호·항 번호는 적지 않고 공종명과 하자 판정기준 같은 일반 표기를 씁니다. 측정하지 않은 수치·허용오차를 지어내지 않습니다. 모든 문장은 ~합니다 존댓말로 끝냅니다. 심각도: 경미(미관), 보통(기능 저하), 중대(안전·구조·누수).'+NL+
    '[JSON 출력] {"defect":true,"confidence":0.0,"label":"","box_2d":[0,0,0,0],"reason":"","work":"공종","sub":"세부공종","type":"하자유형","severity":"경미|보통|중대","detail":"■ 하자현상: ...\\n■ 판정근거: ...\\n■ 심각도: ...\\n■ 시정방법: ...\\n■ 비고: ..."}';

  const box=Array.isArray(r.box_2d)&&r.box_2d.length===4?r.box_2d.map(Number):null;

function remember(g,defect){cam.seen.unshift({g,defect});if(cam.seen.length>12)cam.seen.pop();}
function parseJSON(t){t=String(t||'').replace(/```json|```/g,'').trim();try{let d=JSON.parse(t);return Array.isArray(d)?(d[0]||{}):d;}catch(e){const m=/{[^]*}/.exec(t);try{return m?JSON.parse(m[0]):{};}catch(x){return {};}}}

/* ============================================================ 멀리서 · 가까이 두 장 만들기 */
function makeItem(full,box,r,nt){
  const W=full.width,H=full.height;
  const bx=box[1]/1000*W,by=box[0]/1000*H,bw=(box[3]-box[1])/1000*W,bh=(box[2]-box[0])/1000*H;
  /* 가까이: 하자 상자를 2.4배로 넓히고(최소 화면의 30%), 화면 비율에 맞춰 자른다 */
  let cw=Math.max(bw*2.4,W*0.3),ch=Math.max(bh*2.4,H*0.3);
  if(cw/ch<W/H)cw=ch*W/H;else ch=cw*H/W;
  cw=Math.min(cw,W);ch=Math.min(ch,H);
  const cx=Math.min(Math.max(bx+bw/2-cw/2,0),W-cw),cy=Math.min(Math.max(by+bh/2-ch/2,0),H-ch);
  const close=toCanvas(full,cx,cy,cw,ch,800);
  /* 멀리서: 전체 화면 + 하자 자리에 빨간 상자 */
  const wide=toCanvas(full,0,0,W,H,800),wx=wide.getContext('2d'),k=wide.width/W;
  wx.strokeStyle='#F04438';wx.lineWidth=Math.max(3,Math.round(wide.width/200));wx.strokeRect(bx*k,by*k,bw*k,bh*k);
  const it={id:Date.now()*100+Math.floor(Math.random()*100),job:curJob||'',room:room||'위치미지정',note:nt,label:r.label||'',
    wImg:wide.toDataURL('image/jpeg',0.75),cImg:close.toDataURL('image/jpeg',0.75),
    work:'',sub:'',type:'',severity:'',detail:'🔍 정밀 분석 대기 중…'+NL+'1차 확인: '+(r.reason||''),
    state:'ai',by:cfg().name||'',role:cfg().role||'',t:Date.now()};
  /* 같은 호출에서 받은 분석이 제대로 왔으면 그대로 쓰고 바로 보내기로 넘어간다. 빠졌으면 예전처럼 따로 분석한다 */
  if(r.detail&&String(r.detail).indexOf('■')>=0){
    it.work=r.work||'';it.sub=r.sub||'';it.type=r.type||'';it.severity=r.severity||'';
    it.detail=String(r.detail).split('\\n').join(NL)+NL+NL+'🤖 AI 분석 완료 (참고용) · 실시간 촬영';it.state='send';
  }
  /* 원본(드라이브 보관용): 전체 원본 + 가까이 원본 크기 */
  it._ow=toCanvas(full,0,0,W,H,2560).toDataURL('image/jpeg',0.88);
  it._oc=toCanvas(full,cx,cy,cw,ch,2560).toDataURL('image/jpeg',0.88);
  items.unshift(it);dbPut(it);render();
  queue.push(it);runQueue();
}

/* ============================================================ 정밀 분석 → 팀 서버로 보내기 (한 건씩 차례로) */
const queue=[];let qBusy=false;
async function runQueue(){
  if(qBusy)return;qBusy=true;
  while(queue.length){const it=queue.shift();if(!items.includes(it))continue;
    if(it.state==='ai')await analyze(it);
    if(it.state==='send')await send(it);
  }
  qBusy=false;render();
}
async function analyze(it){
  setState(it,'ai','정밀 분석 중…');
  const workList=Object.keys(WM).map(w=>w+'('+Object.keys(WM[w]).join(',')+')').join('; ');
  const hint=it.note;
  const prompt='당신은 아파트 사전점검 전문 하자진단 AI입니다. '+(hint?'점검자 입력이 사실의 기준이며 사진은 보조 자료입니다.':'사진1(멀리서, 빨간 상자가 하자 자리)로 공종을 파악하고 사진2(가까이)로 하자를 분석하십시오.')+NL+
    (hint?'[점검자 입력] "'+hint+'"'+NL:'')+'[1차 확인] '+it.label+NL+'[위치] '+it.room+NL+'[공종분류] '+workList+NL+
    '[하자유형] 들뜸,마감불량,흠집/찍힘,면불량,오염,미시공,파손,틈새,코킹불량,수직수평불량,개폐불량,고정불량,작동불량,줄눈불량,단차,구배불량,이색/변색,누수,균열,도장불량,이음불량,배수불량,점등불량,악취,기밀불량,결로,곰팡이,잠금불량,소음,풍량부족,필터불량,단열불량'+NL+
    '[판정기준]'+NL+'- 국토부 「공동주택 하자의 조사, 보수비용 산정 및 하자판정기준」 적용'+NL+'- 조 번호·항 번호는 적지 않습니다. 공종명과 하자 판정기준 같은 일반 표기를 씁니다.'+NL+
    '- 측정하지 않은 수치·허용오차를 지어내지 않습니다.'+NL+'- 모든 문장은 ~합니다 존댓말로 끝냅니다. ~함, ~임 같은 말투는 쓰지 않습니다.'+NL+'- 심각도: 경미(미관), 보통(기능 저하), 중대(안전·구조·누수)'+NL+
    '[JSON 출력] {"work":"공종","sub":"세부공종","type":"하자유형","severity":"경미|보통|중대","detail":"■ 하자현상: ...\\n■ 판정근거: ...\\n■ 심각도: ...\\n■ 시정방법: ...\\n■ 비고: ..."}';
  try{
    const d=await api({a:'ai',prompt,images:[{mimeType:'image/jpeg',data:b64(it.wImg)},{mimeType:'image/jpeg',data:b64(it.cImg)}]});countAI();
    if(d.error)throw new Error(d.error==='ai_daily_limit'?'오늘 팀 AI 한도를 넘었습니다':(d.message||d.error));
    const r=parseJSON(d.text);
    if(!r.detail||String(r.detail).indexOf('■')<0)throw new Error('분석 내용이 비어 있습니다');
    it.work=r.work||'';it.sub=r.sub||'';it.type=r.type||'';it.severity=r.severity||'';
    it.detail=String(r.detail).split('\\n').join(NL)+NL+NL+'🤖 AI 분석 완료 (참고용) · 실시간 촬영';
    it.state='send';it.stTxt='';await dbPut(it);render();
  }catch(e){setState(it,'aiErr','분석 실패: '+e.message);}
}
async function send(it){
  if(!it.job){setState(it,'noJob','현장이 없어 이 폰에만 저장했습니다');return;}
  setState(it,'send','팀 서버로 보내는 중…');
  const id=String(it.id),title=jobTitle(it.job);
  try{
    for(const [w,data] of [['w',it.wImg],['c',it.cImg]]){const r=await api({a:'photoPut',job:it.job,id:'p'+id+w,data:b64(data)});if(!r.ok)throw new Error(r.message||r.error||'사진 저장 실패');}
    const r=await api({a:'sync',job:{id:it.job,title:title},since:9e15,items:[{id,t:Date.now(),c:it.id,by:it.by,role:it.role,room:it.room,work:it.work,sub:it.sub,type:it.type,detail:it.detail,hasW:1,hasC:1}],kv:[]});
    if(!r.ok)throw new Error(r.message||r.error||'목록 저장 실패');
    /* 원본은 드라이브의 현장 폴더로 (실패해도 항목은 이미 저장됨) */
    const d=new Date(it.t),p2=n=>String(n).padStart(2,'0'),stamp=''+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds());
    for(const [nm,data] of [['멀리',it._ow],['가까이',it._oc]]){if(!data)continue;try{await api({a:'origPut',job:it.job,title,name:stamp+'_'+it.room+'_'+nm+(it.by?'_'+it.by:'')+'.jpg',data:b64(data)});}catch(e){}}
    delete it._ow;delete it._oc;
    it.state='done';it.stTxt='';await dbPut(it);render();
  }catch(e){setState(it,'sendErr','보내기 실패: '+e.message);}
}
function setState(it,s,t){it.state=s;it.stTxt=t;dbPut(it);render();}
function retry(id){const it=items.find(x=>x.id===id);if(!it)return;if(it.state==='aiErr')it.state='ai';else if(it.state==='sendErr'||it.state==='noJob'){it.state='send';if(!it.job)it.job=curJob||'';}queue.push(it);runQueue();}
function editDetail(id,v){const it=items.find(x=>x.id===id);if(!it)return;it.detail=v;if(it.state==='done'){it.state='send';it.stTxt='고친 내용 — 보내기 대기';}dbPut(it);render();}
function resend(id){const it=items.find(x=>x.id===id);if(it&&it.state==='send'){queue.push(it);runQueue();}}
async function delItem(id){
  const it=items.find(x=>x.id===id);if(!it)return;
  if(!confirm('이 하자를 목록에서 지울까요?'+(it.state==='done'?NL+'팀 서버(팀 앱 목록)에서도 지웁니다.':'')))return;
  if(it.state==='done'&&it.job){try{await api({a:'sync',job:{id:it.job,title:jobTitle(it.job)},since:9e15,items:[{id:String(it.id),del:1,t:Date.now()}],kv:[]});}catch(e){toast('팀 서버에서 지우지 못했습니다: '+e.message,true,3500);return;}}
  items=items.filter(x=>x.id!==id);dbDel(id);render();
}

/* ============================================================ 화면 그리기 */
/* 화면에는 지금 현장(세대)의 하자만 보여 준다. 현장 없이 저장된 것은 어느 현장에서나 보여서 다시 보낼 수 있게 한다 */
const view=()=>items.filter(i=>i.job===curJob||!i.job);
const ST={ai:'⏳ 정밀 분석 중…',send:'⏳ 보내기 대기',done:'✓ 팀 앱에 저장됨'};
const ST_TXT=it=>it.state==='done'?ST.done:(it.stTxt||ST[it.state]||'');
/* ②의 멀리서·가까이 칸과 ③ 하자 정보에는 가장 최근 하자를 보여 준다 */
function drawLatest(){
  const it=view()[0];
  for(const [id,src] of [['pW',it&&it.wImg],['pC',it&&it.cImg]]){const f=$(id);let im=f.querySelector('img');
    if(src){if(!im){im=document.createElement('img');im.alt='';f.prepend(im);}if(im.getAttribute('src')!==src)im.src=src;f.classList.add('has');}else{if(im)im.remove();f.classList.remove('has');}}
  const cell=(id,v,l)=>{const c=$(id);c.textContent=v||l;c.classList.toggle('on',!!v);};
  cell('cR',it&&it.room,'위치');cell('cW',it&&(it.sub||it.work),'공종');cell('cT',it&&(it.type||it.label),'하자내용');
  const d=$('det');
  if(!it){d.className='det empty';d.textContent='AI가 하자를 찾으면 여기에 분석 내용이 나옵니다.';return;}
  d.className='det';d.innerHTML=(it.severity?'<span class="sv sv-'+esc(it.severity)+'">'+esc(it.severity)+'</span>':'')+'<b style="font-size:.82rem;color:var(--ts)">'+esc(ST_TXT(it))+'</b>'+NL+esc(it.detail);
}
function render(){
  const v=view();$('lCnt').textContent=v.length;
  drawLatest();drawRooms();
  const b=$('list');
  /* 고치는 중인 칸이 있으면 다시 그리지 않는다 (글자가 날아가지 않도록) */
  if(b.contains(document.activeElement)&&document.activeElement.tagName==='TEXTAREA')return;
  const n=v.length;
  b.innerHTML=n?v.map((it,i)=>{
    const bad=/Err|noJob/.test(it.state),jt=jobTitle(it.job);
    return '<div class="it"><div class="ph"><figure><img src="'+it.wImg+'" alt=""><figcaption>멀리서</figcaption></figure><figure><img src="'+it.cImg+'" alt=""><figcaption>가까이</figcaption></figure></div>'+
      '<div class="b"><div class="h"><span class="lc">'+(n-i)+'</span><b>'+esc(it.type||it.label||'하자')+'</b>'+(it.severity?'<span class="sv sv-'+esc(it.severity)+'">'+esc(it.severity)+'</span>':'')+'</div>'+
      '<div class="tags"><span>📍 '+esc(it.room)+'</span>'+(it.work?'<span>'+esc(it.work)+'</span>':'')+(it.sub&&it.sub!==it.work?'<span>'+esc(it.sub)+'</span>':'')+'</div>'+
      '<div class="st'+(bad?' err':it.state==='done'?' ok':'')+'">'+esc(ST_TXT(it))+'</div>'+
      '<textarea onchange="editDetail('+it.id+',this.value)">'+esc(it.detail)+'</textarea>'+
      '<div class="ac">'+(bad?'<button class="pri" onclick="retry('+it.id+')">↻ 다시 시도</button>':'')+(it.state==='send'&&!qBusy?'<button class="pri" onclick="resend('+it.id+')">⇪ 팀 서버로 보내기</button>':'')+
      '<button class="del" onclick="delItem('+it.id+')">삭제</button></div>'+
      '<div class="meta">'+new Date(it.t).toLocaleString('ko-KR')+(jt?' · '+esc(jt):'')+(it.by?' · '+esc(it.by):'')+'</div></div></div>';
  }).join(''):'<div class="none">아직 저장된 하자가 없습니다.</div>';
  b.querySelectorAll('textarea').forEach(x=>{x.style.height='auto';x.style.height=(x.scrollHeight+4)+'px';});
}

/* ============================================================ 맨 아래 세 단추 (팀 앱과 같은 일을 팀 서버에서 한다)
   - AI전체검증: 이 현장의 팀 리스트 전체(두 사람 몫)를 AI가 다시 읽고 고칠 점을 알려 준다 (내용은 바꾸지 않음)

const jobName=id=>jobTitle(id)||'현장명';
function canServer(){
  if(!cfg().pin){toast('팀 설정에서 팀 비밀번호를 먼저 넣어 주십시오',true,3000);openCfg();return false;}
  if(!navigator.onLine){toast('인터넷에 연결된 뒤 눌러 주십시오',true,3000);return false;}
  if(!curJob){toast('① 주소를 먼저 넣어 주십시오',true,3000);return false;}
  return true;
}
/* 아직 분석·보내기 중인 이 현장 항목이 있으면 끝날 때까지 기다린다 (최대 90초) */
async function flush(btn,lbl){
  const pend=()=>items.some(i=>i.job===curJob&&(i.state==='ai'||i.state==='send'));
  for(let i=0;i<60&&(qBusy||pend());i++){if(btn)btn.textContent='보내는 중…';if(!qBusy)runQueue();await new Promise(r=>setTimeout(r,1500));}
  if(btn)btn.innerHTML=lbl;
}
async function teamList(){
  try{const r=await api({a:'sync',job:{id:curJob,title:jobName(curJob)},since:0,items:[],kv:[]});
    const l=r.ok?(r.items||[]).filter(x=>x&&!x.del).sort((a,b)=>(Number(a.c)||0)-(Number(b.c)||0)):[];if(l.length)return l;}catch(e){}
  return items.filter(i=>i.job===curJob).slice().reverse();
}
async function busyBtn(id,txt,fn){const b=$(id);if(b.disabled)return;const lbl=b.innerHTML;b.disabled=true;b.textContent=txt;try{await fn(b,lbl);}finally{b.disabled=false;b.innerHTML=lbl;}}

function review(){if(!canServer())return;busyBtn('bRv','검토 중…',async(b,lbl)=>{
  await flush(b,lbl);b.textContent='검토 중…';
  const list=await teamList();
  if(!list.length){alert('검토할 내용이 없습니다.');return;}
  openMo('rv','<h3>🤖 AI 전체검증</h3><div id="rvBody" class="note" style="font-size:.9rem">점검 리스트 '+list.length+'건을 검토하고 있습니다…</div>');
  const rows=list.map((it,i)=>(i+1)+'. ['+(it.room||'')+'] '+[it.work,it.sub,it.type].filter(Boolean).join('/')+' — '+String(it.detail||'').replace(/\s+/g,' ').slice(0,220)).join(NL).slice(0,14000);
  const prompt='당신은 신축 아파트 사전점검 보고서를 검수하는 사람입니다. 아래 점검 리스트를 다시 읽고 고칠 점을 찾으십시오.'+NL+'[찾을 것] 공종·유형 분류가 틀린 항목, 같은 하자가 중복된 항목, 위치가 빠진 항목, 표현이 모호하거나 과장된 항목, 판정 근거가 약한 항목.'+NL+'[규칙] 존댓말로 짧게 씁니다. 수치·허용오차·조 번호를 지어내지 않습니다. 문제가 없으면 issues 를 빈 배열로 둡니다. issues 는 최대 10개.'+NL+'[JSON 출력] {"summary":"전체 총평 2~3문장","issues":[{"no":항목번호,"comment":"고칠 점 한 문장"}]}'+NL+'[점검 리스트]'+NL+rows;
  try{
    const r=await api({a:'ai',prompt,images:[]});countAI();
    if(r.error)throw new Error(r.error==='ai_daily_limit'?'오늘 팀 AI 한도를 넘었습니다':(r.message||r.error));
    const d=parseJSON(r.text),is=Array.isArray(d.issues)?d.issues:[];
    const box=$('rvBody');if(!box)return;
    box.className='';
    box.innerHTML='<div class="rvb">'+esc(d.summary||'총평을 받지 못했습니다.')+'</div>'+(is.length?is.map(x=>{const it=list[(Number(x.no)||0)-1];return '<div class="rvb"><b>'+esc(x.no)+'번'+(it?' · '+esc(it.room)+' '+esc(it.type||it.sub||''):'')+'</b><br>'+esc(x.comment)+'</div>';}).join(''):'<div class="rvb">고칠 점을 찾지 못했습니다.</div>')+
      '<div class="note">팀 리스트 '+list.length+'건 기준입니다. AI 의견은 참고용이며 리스트 내용은 바뀌지 않았습니다.</div><button class="btn gray" onclick="closeMo()">닫기</button>';
  }catch(e){const box=$('rvBody');if(box)box.textContent='AI 전체검증을 하지 못했습니다: '+e.message;}
});}

function saveFile(){if(!canServer())return;busyBtn('bFile','만드는 중…',async(b,lbl)=>{
  await flush(b,lbl);b.textContent='만드는 중…';
  toast('보고서를 만들고 있습니다. 잠시 기다려 주십시오',false,4000);
  try{
    const r=await api({a:'reportPut',job:curJob,title:jobTitle(curJob),ret:1,nosave:1});
    if(!r.ok||!r.data)throw new Error(r.error==='bad_action'?'서버가 옛 판입니다 (팀 앱 서버 재배포 필요)':(r.message||r.error||'내용이 없습니다'));
    const bin=atob(r.data),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));a.download=r.name||'사전점검.pdf';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    toast('📁 내 파일(다운로드)에 보고서를 저장했습니다'+NL+(r.name||''),false,5000);
  }catch(e){toast('보고서를 만들지 못했습니다: '+e.message,true,4500);}
});}

function saveAll(){if(!canServer())return;busyBtn('bAll','만드는 중…',async(b,lbl)=>{
  await flush(b,lbl);b.textContent='만드는 중…';
  toast('보고서를 만들어 드라이브에 넣고 있습니다',false,4000);
  try{
    const r=await api({a:'reportPut',job:curJob,title:jobTitle(curJob)});
    if(!r.ok)throw new Error(r.error==='bad_action'?'서버가 옛 판입니다 (팀 앱 서버 재배포 필요)':(r.message||r.error));
    if(jobs[curJob]){jobs[curJob].report=r.url;L.set('team_jobs',jobs);}
    openMo('rep','<h3>📄 보고서가 완성됐습니다</h3><div class="note" style="font-size:.9rem;color:#344054">팀 리스트 '+esc(r.count)+'건으로 고객 제출용 보고서(PDF)를 만들어 구글 드라이브의 현장 폴더에 넣었습니다.<br><span style="color:var(--th);font-size:.78rem">'+esc(r.name||'')+'</span></div>'+
      '<a class="btn" target="_blank" rel="noopener" href="'+esc(r.url)+'">보고서 열기</a><button class="btn gray" onclick="closeMo()">닫기</button>');
  }catch(e){toast('전체저장을 하지 못했습니다: '+e.message,true,4500);}
});}

/* ============================================================ 새 판 자동 반영 (화면으로 돌아올 때, 진행 중인 일이 없으면) */
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||qBusy||cam.busy)return;
  try{const t=await (await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text();const m=/const BUILD='([^']+)'/.exec(t);if(m&&m[1]!==BUILD)location.reload();}catch(e){}
});

/* ============================================================ 시작 */
(async()=>{
  drawJobs();drawRooms();drawNote();setCfgBadge('');drawPow();
  items=(await dbAll()).sort((a,b)=>b.id-a.id);
  /* 끝나지 않은 일은 다시 줄 세운다 */
  items.forEach(it=>{if(it.state==='ai'||it.state==='send')queue.push(it);});
  render();runQueue();
  if(cfg().pin)pullJobs();else setTimeout(openCfg,400);
})();
</script>
