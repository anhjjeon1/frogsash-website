<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>청개구리 사전점검 팀앱</title>
<style>
:root{--p:#1B6B3A;--pl:#E7F1EA;--b:#CBD5E1;--t:#1a1a1a;--m:#64748B;--r:#B91C1C;--o:#B45309;--bl:#1D4ED8}
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:15px;color:var(--t);background:#F3F5F4;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px}
header .ttl{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:6px;padding:6px 9px;font-size:13px}
.ver{font-size:12px;opacity:.85;white-space:nowrap}
#sync{font-size:12px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.2);white-space:nowrap}
#sync.ok{background:#22C55E}#sync.ing{background:#F59E0B}#sync.off{background:#94A3B8}#sync.err{background:#DC2626}
.wrap{max-width:640px;margin:0 auto;padding:10px 10px 40px}
.card,.sec{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.sec-t{font-weight:800;font-size:15.5px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sec-t .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--p);color:#fff;align-items:center;justify-content:center;font-size:13px}
.sec-t .rt{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--m)}
h2{font-size:15px;color:var(--p);margin:0 0 8px}
label{display:block;font-size:12.5px;color:var(--m);margin:8px 0 3px}
input[type=text],input[type=password],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--b);border-radius:8px;padding:10px;font-size:16px;font-family:inherit;background:#fff}
textarea{min-height:58px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:inline-block;border:0;border-radius:10px;padding:13px 14px;font-size:16px;font-weight:800;background:var(--p);color:#fff}
.btn.g{background:#E2E8F0;color:#1E293B;font-weight:700}.btn.r{background:#FEE2E2;color:var(--r)}.btn.w{width:100%}.btn.s{padding:9px 12px;font-size:14px}
.btn.ai{background:#1D4ED8}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--b);border-radius:18px;padding:8px 13px;font-size:15px;background:#fff}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.selbtn{width:100%;text-align:left;border:1.5px solid var(--b);border-radius:8px;padding:11px;font-size:16px;background:#fff;color:var(--m)}
.selbtn.sel{border-color:var(--p);color:var(--p);font-weight:800}
.inm{position:relative}.inm textarea{padding-right:54px}
.micb{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;border:0;background:var(--pl);font-size:20px}
.micb.on{background:var(--r)}
.pbox{flex:1;border:2px dashed var(--b);border-radius:10px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--m);font-size:14px;font-weight:700;background:#fff center/cover no-repeat;position:relative}
.pbox i{font-style:normal;font-size:26px}
.pbox input{position:absolute;inset:0;opacity:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:8px 0 2px}
.tg{font-size:13px;border-radius:5px;padding:2px 8px;color:#fff;background:var(--p)}.tg.t1{background:#0F766E}.tg.t2{background:var(--o)}
details{margin-top:8px}summary{font-size:13.5px;color:var(--bl);padding:6px 0}
.ban{background:#FEF3C7;border:1px solid #F59E0B;border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ban b{flex:1}
.ck{display:inline-flex;align-items:center;gap:5px;margin:4px 12px 4px 0;font-size:14px;color:var(--t)}
.ck input{width:19px;height:19px}
table.g{border-collapse:collapse;width:100%;font-size:13px}
table.g th,table.g td{border:1px solid #94A3B8;padding:4px;text-align:center}
table.g th{background:var(--pl);font-size:12px;font-weight:600}
table.g td.l{background:#F4F7F5;text-align:left;font-weight:600;font-size:12.5px;white-space:nowrap}
table.g td.c{height:38px;min-width:34px;font-size:18px;font-weight:700;cursor:pointer;user-select:none}
table.g td.c.x{color:var(--r)}table.g td.c.d{color:var(--o)}table.g td.c.o{color:var(--p)}
table.g input{border:0;padding:6px 2px;text-align:center;font-size:14px;min-width:46px}
.sx{overflow-x:auto}
.it{display:flex;gap:10px;padding:10px;border:1px solid var(--b);border-radius:10px;background:#fff;margin-bottom:8px}
.it .no{font-weight:800;color:var(--p);min-width:22px}
.it .bd{flex:1;min-width:0}
.it .hd{font-weight:700;font-size:14.5px}
.it .ph{font-size:13.5px;color:#334155;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.it .by{font-size:11.5px;color:var(--m);margin-top:3px}
.it img{width:58px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--b)}
.tag{display:inline-block;font-size:11.5px;border-radius:4px;padding:1px 6px;margin-right:4px;color:#fff}
.tag.c0{background:var(--r)}.tag.c1{background:var(--o)}.tag.c2{background:var(--bl)}
#more{position:fixed;inset:0;z-index:40;background:#F3F5F4;overflow-y:auto;display:none}
#more .bar{position:sticky;top:0;background:var(--p);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px;z-index:3}
#more .bar b{flex:1}
#more .bar button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:6px;padding:7px 12px;font-size:14px;font-weight:700}
.tabs{position:sticky;top:46px;z-index:2;display:flex;background:#fff;border-bottom:1px solid var(--b)}
.tabs button{flex:1;border:0;background:none;padding:11px 8px;font-size:14px;color:var(--m);border-bottom:3px solid transparent}
.tabs button.on{color:var(--p);font-weight:700;border-bottom-color:var(--p)}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:60;display:none;max-width:88%;text-align:center}
.note{font-size:12.5px;color:var(--m)}
</style>
</head>
<body>

<header>
  <button id="bBack" style="display:none" onclick="A.back()">◀</button>
  <div class="ttl" id="hTitle">청개구리 사전점검 팀앱</div>
  <span id="hVer" class="ver"></span>
  <span id="sync" class="off">미연결</span>
  <button onclick="A.setup()">설정</button>
</header>

<!-- 설정 -->
<div class="wrap" id="vSetup" style="display:none">
  <div class="card">
    <h2>점검자 설정</h2>
    <label>이름</label><input type="text" id="cName" placeholder="보고서 점검자 칸에 들어갑니다">
    <label>담당 분야</label>
    <div class="chips" id="cRole">
      <span class="chip" data-v="창호">창호</span><span class="chip" data-v="내장·기타">내장 · 기타</span>
    </div>
  </div>
  <div class="card">
    <h2>함께 입력하기 (서버 연결)</h2>
    <p class="note">두 사람이 같은 서버 주소와 같은 팀 비밀번호를 넣으면 같은 현장을 함께 입력합니다. 비워 두면 이 기기에만 저장됩니다.</p>
    <label>서버 주소 (웹 앱 URL)</label><input type="url" id="cGas" placeholder="https://script.google.com/macros/s/…/exec">
    <label>팀 비밀번호 (4자 이상)</label><input type="password" id="cPin" autocomplete="off">
    <p class="note" id="cMsg"></p>
  </div>
  <button class="btn w" onclick="A.saveSetup()">저장</button>
</div>

<!-- 현장 목록 -->
<div class="wrap" id="vList" style="display:none">
  <button class="btn w" onclick="A.newJob()">＋ 새 현장</button>
  <div id="jobList" style="margin-top:10px"></div>
</div>

<!-- 현장: 한 화면에서 위에서 아래로 입력 -->
<div id="vJob" style="display:none">
  <div class="wrap">

    <div class="sec">
      <div class="sec-t"><span class="n">1</span> 현장</div>
      <input type="text" data-k="m.apt" placeholder="단지 이름">
      <div class="row" style="margin-top:8px">
        <input type="text" data-k="m.unit" placeholder="동 · 호수">
        <button class="btn g s" style="flex:0 0 auto" onclick="A.more(0)">세대 정보 · 점검표</button>
      </div>
    </div>

    <div class="sec" id="form">
      <div class="ban" id="edBan" style="display:none"><b id="edBanT"></b><button class="btn g s" onclick="A.reset()">취소</button><button class="btn r s" onclick="A.del()">삭제</button></div>

      <div class="sec-t"><span class="n">2</span> 사진 촬영</div>
      <div class="row">
        <div class="pbox" id="eP1"><span><i>📷</i><br>멀리서 찍기</span><input type="file" accept="image/*" onchange="A.photo(1,this)"></div>
        <div class="pbox" id="eP2"><span><i>🔍</i><br>가까이 찍기</span><input type="file" accept="image/*" onchange="A.photo(2,this)"></div>
      </div>

      <div class="sec-t" style="margin-top:14px"><span class="n">3</span> 하자 정보</div>
      <button type="button" class="selbtn" id="roomBtn" onclick="A.toggleRoom()">위치 선택 ▾</button>
      <div class="chips" id="eRoom" style="display:none;margin-top:8px"></div>
      <div class="inm" style="margin-top:8px">
        <textarea id="ePhen" placeholder="하자내용 (예: 창호 수직수평 불량)"></textarea>
        <button type="button" class="micb" id="bMic" onclick="A.mic()" aria-label="말로 입력">🎤</button>
      </div>
      <div class="tags" id="tags"></div>
      <div class="chips" id="eCls" style="margin-top:6px"><span class="chip" data-v="하자">하자</span><span class="chip" data-v="재측정">입주 후 재측정</span><span class="chip" data-v="참고">참고</span></div>

      <details id="selBox"><summary>공종 직접 고르기</summary>
        <div class="row"><select id="eWork"></select><select id="eSub"></select></div>
        <select id="eType" style="margin-top:8px"></select>
      </details>
      <details id="dt"><summary>상세 (측정값 · 판정 근거 · 처리 방법)</summary>
        <button class="btn ai w s" id="bAI" onclick="A.ai()">🤖 AI 초안 작성</button>
        <label>측정값 (측정한 경우만)</label><input type="text" id="eMeas" placeholder="예: 수직 편차 ○mm (레이저 레벨)">
        <label>판정 근거</label><textarea id="eBasis"></textarea>
        <label>시공사의 통상 처리 방법</label><textarea id="eFix"></textarea>
        <label>보수 요청 때 확인할 점</label><textarea id="eAsk"></textarea>
        <div id="eWhenBox"><label>재측정 권장 시기</label><input type="text" id="eWhen" placeholder="예: 입주 후 첫 겨울"></div>
      </details>

      <button class="btn w" style="margin-top:12px" onclick="A.save()">✔ 리스트에 저장</button>
    </div>

    <div class="sec">
      <div class="sec-t"><span class="n">4</span> 점검 리스트 <span id="lCnt">0</span>건
        <span class="rt"><span class="chips" id="fil" style="display:inline-flex"><span class="chip on" data-v="" style="padding:4px 10px;font-size:13px">전체</span><span class="chip" data-v="me" style="padding:4px 10px;font-size:13px">내 것</span></span></span>
      </div>
      <div id="items"></div>
    </div>

    <button class="btn w" onclick="A.report()">📄 전체 저장 (PDF 보고서)</button>
  </div>

  <!-- 세대 정보 · 점검표 (선택 입력) -->
  <div id="more">
    <div class="bar"><button onclick="A.closeMore()">닫기</button><b>세대 정보 · 점검표</b></div>
    <div class="tabs" id="tabs"><button data-t="0" class="on">세대 정보</button><button data-t="2">창호표</button><button data-t="3">내장표</button></div>
    <div class="wrap"><div id="t0"></div><div id="t2" style="display:none"></div><div id="t3" style="display:none"></div></div>
  </div>
</div>

<div id="toast"></div>

<script>

let _db;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('it_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
async function pGet(id){if(!id)return null;try{const d=await idb();return await new Promise(r=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});}catch(e){return null;}}
async function pPut(o){const d=await idb();return new Promise((r,j)=>{const tx=d.transaction('p','readwrite');tx.objectStore('p').put(o);tx.oncomplete=()=>r();tx.onerror=()=>j(tx.error);});}
async function pPending(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('p').objectStore('p').getAll();q.onsuccess=()=>r((q.result||[]).filter(x=>!x.up));q.onerror=()=>r([]);});}catch(e){return [];}}
function resize(file,max){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',0.8));};img.onerror=rej;img.src=URL.createObjectURL(file);});}

function loadJob(id){cur=id;J=LS.get('it_job_'+id,{items:{},kv:{},dirtyI:{},dirtyK:{},rev:0});}
function saveJob(){if(cur)LS.set('it_job_'+cur,J);}
function kv(k){return J&&J.kv[k]?J.kv[k].v:'';}
function setKV(k,v){J.kv[k]={v:v,t:Date.now(),by:cfg.name};J.dirtyK[k]=1;saveJob();if(k==='m.apt'||k==='m.unit'){jobs[cur].title=jobTitle();jobs[cur].t=Date.now();LS.set('it_jobs',jobs);$('hTitle').textContent=jobTitle();}kick();}
function jobTitle(){const s=((kv('m.apt')||'')+' '+(kv('m.unit')||'')).trim();return s||'새 현장';}
function liveItems(){return Object.values(J.items).filter(i=>!i.del).sort((a,b)=>(a.c||0)-(b.c||0));}

async function api(body){const r=await fetch(cfg.gas,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({pin:cfg.pin},body))});if(!r.ok)throw new Error('서버 응답 '+r.status);return r.json();}
function setSync(s){const e=$('sync');const dirty=J?Object.keys(J.dirtyI).length+Object.keys(J.dirtyK).length:0;
  if(!cfg.gas){e.className='off';e.textContent='이 기기만';return;}
  if(s==='ing'){e.className='ing';e.textContent='보내는 중';return;}
  if(!navigator.onLine){e.className='off';e.textContent='오프라인'+(dirty?' · 대기 '+dirty:'');return;}
  if(s==='err'){e.className='err';e.textContent='연결 오류'+(dirty?' · 대기 '+dirty:'');return;}
  e.className=dirty?'ing':'ok';e.textContent=dirty?'대기 '+dirty:'함께 입력 중';}
function kick(){setSync();clearTimeout(kickT);kickT=setTimeout(sync,1200);}
async function sync(){
  if(!cfg.gas||!cur||syncing){setSync();return;}
  if(!navigator.onLine){setSync();return;}
  syncing=true;setSync('ing');
  const id=cur,job=J;let changed=false,again=false;
  try{
    const di=Object.keys(job.dirtyI),dk=Object.keys(job.dirtyK);
    const sI={},sK={};di.forEach(i=>sI[i]=job.items[i].t);dk.forEach(k=>sK[k]=job.kv[k].t);
    const res=await api({a:'sync',job:{id:id,title:jobs[id]?jobs[id].title:''},since:job.rev,items:di.map(i=>job.items[i]),kv:dk.map(k=>({k:k,v:job.kv[k].v,t:job.kv[k].t,by:job.kv[k].by}))});
    if(res.error)throw new Error(res.error==='bad_pin'?'팀 비밀번호가 다릅니다':(res.message||res.error));
    di.forEach(i=>{if(job.items[i]&&job.items[i].t===sI[i])delete job.dirtyI[i];else again=true;});
    dk.forEach(k=>{if(job.kv[k]&&job.kv[k].t===sK[k])delete job.dirtyK[k];else again=true;});
    (res.items||[]).forEach(r=>{const l=job.items[r.id];if(!l||(!job.dirtyI[r.id]&&r.t>=l.t&&JSON.stringify(l)!==JSON.stringify(r))||r.t>l.t){job.items[r.id]=r;delete job.dirtyI[r.id];changed=true;}});
    (res.kv||[]).forEach(r=>{const l=job.kv[r.k];if(!l||(!job.dirtyK[r.k]&&r.t>=l.t&&l.v!==r.v)||r.t>l.t){job.kv[r.k]={v:r.v,t:r.t,by:r.by};delete job.dirtyK[r.k];changed=true;}});
    job.rev=res.rev||job.rev;
    LS.set('it_job_'+id,job);
    lastErr='';
    const pend=(await pPending()).filter(p=>p.job===id).slice(0,3);
    for(const p of pend){const r=await api({a:'photoPut',job:id,id:p.id,data:p.data.split(',')[1]});if(r.ok){p.up=1;await pPut(p);}}
    let got=0;
    for(const it of Object.values(job.items)){if(it.del)continue;for(const pid of [it.p1,it.p2]){if(!pid||got>=3)continue;if(await pGet(pid))continue;const r=await api({a:'photoGet',id:pid});if(r.ok){await pPut({id:pid,job:id,data:'data:image/jpeg;base64,'+r.data,up:1});got++;changed=true;}}}
    if(pend.length===3||got>=3)again=true;
    if(cur===id){if(changed){const t=jobTitle();if(jobs[id]&&jobs[id].title!==t){jobs[id].title=t;LS.set('it_jobs',jobs);$('hTitle').textContent=t;}applyKV();renderItems();renderSum();}setSync();}
  }catch(e){lastErr=String(e.message||e);if(cur===id)setSync('err');}
  syncing=false;
  // 보내는 동안 새로 쌓인 것이 있으면 기다리지 않고 바로 다시 보낸다
  if(!lastErr&&cur===id&&(again||Object.keys(job.dirtyI).length||Object.keys(job.dirtyK).length))kick();
}

function _normKW(s){ return (s||'').replace(/[\s\/\-_]/g,'').toLowerCase(); }
function _hasKW(t, original, synonyms){
  const variants = [original].concat(synonyms||[]);
  for(const v of variants){
    const k = _normKW(v);
    if(k && t.includes(k)) return true;
  }
  return false;
}
function _matchWM(text){
  const t = _normKW(text);
  if(!t) return {work:'',sub:'',type:''};
  let best = {work:'', sub:'', type:'', score:0};
  for(const work of Object.keys(WM)){
    const wShort = work.replace(/공사$/,'');
    const wHit = _hasKW(t, work, []) || _hasKW(t, wShort, []);
    for(const sub of Object.keys(WM[work])){
      const sSyn = _SYN.sub[sub] || [];
      const sHit = _hasKW(t, sub, sSyn);
      const anchorHit = sHit || wHit; /* type 점수는 sub/work 매칭 시에만 부여 */
      let anyTypeHitInAnchor = false;
      for(const type of WM[work][sub]){
        const tySyn = _SYN.type[type] || [];
        const tHit = _hasKW(t, type, tySyn);
        if(tHit && anchorHit) anyTypeHitInAnchor = true;
        const typeScore = (tHit && anchorHit) ? 5 : 0;
        const score = typeScore + (sHit?3:0) + (wHit?1:0);
        if(score > best.score){
          best = {work, sub, type: (tHit && anchorHit) ? type : '', score};
        }
      }
      if(!anyTypeHitInAnchor && anchorHit){
        const score = (sHit?3:0) + (wHit?1:0);
        if(score > best.score){
          best = {work, sub: sHit?sub:'', type:'', score};
        }
      }
    }
  }
  if(best.score <= 0) return {work:'',sub:'',type:''};
  return {work:best.work, sub:best.sub, type:best.type};
}
